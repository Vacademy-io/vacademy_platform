name: Figma BV eval (tier 1)

# Tier-1 Brahm Varchas golden (ai_service/evals/figma_bv): the design_import
# plan on the real Figma inputs, scored against the committed site fixture.
#
# The inputs are CLIENT MATERIAL kept in a PRIVATE S3 prefix and never
# committed (see ai_service/evals/figma_bv/README.md). This job pulls them
# with the repository secrets below and SKIPS (green, with a notice) when
# FIGMA_BV_S3_URI is not set — forks, Dependabot, or a repo without the bucket.
#
# Secrets:
#   FIGMA_BV_S3_URI          s3://<private-bucket>/<prefix> (required to run)
#   FIGMA_BV_AWS_ACCESS_KEY  optional read-only key for that prefix; falls back
#   FIGMA_BV_AWS_SECRET_KEY  to AWS_ACCESS_KEY / AWS_SECRET_ACCESS_KEY
#   FIGMA_BV_AWS_REGION      optional, default us-east-1
#
# The AWS credentials are given ONLY to the download step (the preinstalled
# aws CLI); dependency install and the eval run without them. Nothing is
# uploaded as an artifact: the scorecard can quote the client's copy.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ai_service/evals/**"
      - "ai_service/app/services/figma_design_import.py"
      - "ai_service/app/services/assistant_tools_design_import.py"
      - "ai_service/app/services/assistant_tools_website_edit.py"
      - "ai_service/app/data/catalogue_schema_catalog.json"
      - "ai_service/requirements.txt"
      - "frontend-admin-dashboard/src/routes/manage-pages/-components/__fixtures__/brahm-varchas-site.json"
      - ".github/workflows/figma-bv-eval.yml"
  push:
    paths:
      - "ai_service/evals/**"
      - "ai_service/app/services/figma_design_import.py"
      - "ai_service/app/services/assistant_tools_design_import.py"
      - "ai_service/app/services/assistant_tools_website_edit.py"
      - "ai_service/app/data/catalogue_schema_catalog.json"
      - "ai_service/requirements.txt"
      - "frontend-admin-dashboard/src/routes/manage-pages/-components/__fixtures__/brahm-varchas-site.json"
      - ".github/workflows/figma-bv-eval.yml"

permissions:
  contents: read

concurrency:
  group: figma-bv-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tier1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIGMA_BV_S3_URI: ${{ secrets.FIGMA_BV_S3_URI }}
    steps:
      - name: Check for the private eval inputs
        id: gate
        run: |
          if [ -z "$FIGMA_BV_S3_URI" ]; then
            echo "::notice title=Figma BV eval skipped::FIGMA_BV_S3_URI is not set (fork, Dependabot, or no private bucket). See ai_service/evals/figma_bv/README.md."
            echo "### Figma BV eval: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The private inputs are not configured (secret \`FIGMA_BV_S3_URI\`), so nothing was scored." >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            case "$FIGMA_BV_S3_URI" in
              s3://?*/?*) echo "run=true" >> "$GITHUB_OUTPUT" ;;
              *) echo "::error title=Figma BV eval::FIGMA_BV_S3_URI must look like s3://<bucket>/<prefix>"; exit 1 ;;
            esac
          fi

      - name: Checkout
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4

      # Credentials live in this step's env only. The file list comes from
      # expected.json so the job and the runner can never disagree.
      - name: Download eval inputs (private S3)
        if: steps.gate.outputs.run == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.FIGMA_BV_AWS_ACCESS_KEY || secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.FIGMA_BV_AWS_SECRET_KEY || secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.FIGMA_BV_AWS_REGION || 'us-east-1' }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/figma-bv-inputs"
          mkdir -p "$dest"
          uri="${FIGMA_BV_S3_URI%/}"
          python3 -c 'import json; d = json.load(open("ai_service/evals/figma_bv/expected.json")); print("\n".join([d["metadata"], *d["design_code"].values()]))' \
            | while read -r name; do
                aws s3 cp "$uri/$name" "$dest/$name" --only-show-errors
              done
          ls -l "$dest"

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_service/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        working-directory: ai_service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tier-1 eval (--check)
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        working-directory: ai_service
        env:
          APP_ENV: stage
          FIGMA_BV_INPUTS: ${{ runner.temp }}/figma-bv-inputs
          FIGMA_BV_S3_URI: ""
        run: python -m evals.figma_bv.run --check --json "$RUNNER_TEMP/figma-bv-card.json"

      - name: Scorecard summary
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          card="$RUNNER_TEMP/figma-bv-card.json"
          if [ ! -f "$card" ]; then
            echo "### Figma BV eval: no scorecard (the run failed before scoring)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python3 - "$card" >> "$GITHUB_STEP_SUMMARY" << 'PY'
          import json, sys
          card = json.load(open(sys.argv[1]))
          s, t = card["sections"], card["tokens"]
          print(f"### Figma BV eval: {'PASS' if card['passed'] else 'FAIL'}")
          print()
          print("| check | result |")
          print("|---|---|")
          for name, ok in card["checks"].items():
              print(f"| {name} | {'pass' if ok else 'FAIL'} |")
          print()
          print(f"patterns P={s['precision']:.2f} R={s['recall']:.2f}, palette {t['palette_within_de5']}/{t['palette_roles']} within dE 5, "
                f"plan {card.get('plan_seconds')} s")
          for name, line in (card.get("variants") or {}).items():
              print(f"- {name}: {line}")
          PY

      - name: Remove the client inputs
        if: always() && steps.gate.outputs.run == 'true'
        run: rm -rf "$RUNNER_TEMP/figma-bv-inputs" "$RUNNER_TEMP/figma-bv-card.json"
