spring.application.name=assessment_service


# AI copy-check queue. The poller drains PENDING evaluations (bulk uploads and
# opt-in auto-evaluation on submit) under a global in-flight cap; the sweeper
# re-queues copies whose worker went silent (an ai-service redeploy) instead of
# failing them. One ai-service pod + one render-worker = about 3 copies at once.
assessment.ai-evaluation.poller-enabled=true
assessment.ai-evaluation.max-in-flight=3
assessment.ai-evaluation.poller-batch-size=3
assessment.ai-evaluation.stale-timeout-minutes=20
assessment.ai-evaluation.max-requeues=2
