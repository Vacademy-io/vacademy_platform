spring.application.name=community_service
server.port=8073
management.endpoints.web.base-path=/community-service
management.endpoints.web.path-mapping.health=actuator/health
springdoc.api-docs.path=/community-service/api-docs
springdoc.swagger-ui.path=/community-service/swagger-ui.html
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}


# ============ HikariCP Connection Pool Configuration ============
# These settings are CRITICAL for preventing inconsistent API latency

# Maximum number of connections in the pool
# 8 = 1 reserved for async dbWriter + 7 for request threads
spring.datasource.hikari.maximum-pool-size=8

# Minimum number of idle connections to maintain
spring.datasource.hikari.minimum-idle=2

# How long (ms) to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=60000

# How long a connection can be idle before being retired
spring.datasource.hikari.idle-timeout=300000

# Maximum lifetime of a connection
spring.datasource.hikari.max-lifetime=600000

# Connection validation timeout
spring.datasource.hikari.validation-timeout=5000

# Keep connections alive
spring.datasource.hikari.keepalive-time=60000

# Log pool usage warnings
spring.datasource.hikari.leak-detection-threshold=60000

# Sentry Configuration
sentry.dsn=${SENTRY_DSN}
sentry.send-default-pii=true

# Tomcat tuning for 1000 concurrent SSE connections
# Async SSE doesn't hold Tomcat threads, but burst of initial connects needs queue room
server.tomcat.threads.max=300
server.tomcat.accept-count=500

# Performance Monitoring - reduced from 1.0; at 1000 students × N slides 100% sampling
# adds significant CPU + network overhead to Sentry. 10% still gives good observability.
sentry.traces-sample-rate=0.1
# Enable performance monitoring for all integrations
sentry.enable-tracing=true
# Database query monitoring
sentry.trace-propagation-targets=localhost,127.0.0.1
# Additional performance settings
sentry.in-app-includes=vacademy.io

# ============ Scheduler thread pool ============
# Spring's default @Scheduled TaskScheduler is SINGLE-THREADED, so every @Scheduled
# method in this service shares one thread and they block each other.
#
# That coupling is not theoretical here. BbbHealthCheckService builds its client as
# `new RestTemplate()` with NO connect or read timeout, so a hung BBB server or a
# stalled GitHub Actions dispatch can park the only scheduler thread indefinitely.
# On a single-threaded pool that would silently stop the platform health monitor
# from ever running again — a monitor that dies quietly is worse than none.
#
# It bites in the other direction too: the platform health check runs every 5
# minutes and can take up to ~100s worst case (4 probes + 3 WhatsApp sends, each
# bounded by its own timeouts). BBB's crons fire at 15:00, 15:20 and 23:55 IST,
# which overlaps the :00 tick, so on a shared thread a BBB server start could be
# delayed behind it.
#
# A small pool decouples them. 5 covers today's 4 @Scheduled methods with headroom.
spring.task.scheduling.pool.size=5
