<!doctype html>
<!--
  Vacademy — Admin Portal Demo (generated)
  Do not edit this file directly. Edit build/admin-demo.json (content) or
  build/admin-demo-template.html (shell), then run:
    python3 build_admin_demo.py admin-demo.json admin-demo-template.html explorer-template.html ..
  The mock CSS/JS engine is lifted verbatim from explorer-template.html at build
  time, so the portal demo and the feature catalog can never drift apart.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__TAGLINE__">
<style>
/* ==== mock engine (shared with the feature catalog) ==== */
__MOCK_CSS__

/* ==== full-viewport portal chrome ==== */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#EFE7DE;color:#211B15;-webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100vh;width:100vw}
/* the mock fills the window instead of sitting in a card */
#app .mock{max-width:none;width:100%;height:100vh;border:0;border-radius:0;box-shadow:none;font-size:13.5px}
#app .mock-main{overflow:auto}
#app .mock-side{width:230px}
#app .mock-side .ms-nav{overflow-y:auto}
#app .mock-rail .rm,#app .mock-side .ni,#app .mock-urail .ur,#app .mtabs .tb,
#app .mock-top .mt-switch,#app .mcard .cbtn,#app .mbtn{cursor:pointer}
#app .mock-side .ni:not(.on):hover{background:#FBF5EF}
#app .mock-rail .rm:not(.on):hover{background:rgb(255 255 255/.14)}
#app .mtable tbody tr:hover td{background:#FEFBF8}

/* assistant docked over the portal, opened from the Assist rail item */
#assist{position:fixed;right:78px;bottom:78px;z-index:45;display:none}
#assist.open{display:block}
#assist .massist{max-height:calc(100vh - 130px)}
@media (max-width:900px){#assist{right:14px;bottom:70px}}

/* demo banner */
.dbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:40;
  display:flex;align-items:center;gap:12px;background:#211B15;color:#fff;
  border-radius:99px;padding:9px 10px 9px 18px;box-shadow:0 10px 34px rgb(0 0 0/.28);
  font-size:12.5px;font-weight:600;max-width:calc(100vw - 32px);
}
.dbar b{font-weight:750}
.dbar .tag{background:#ED7424;color:#fff;font-size:9.5px;font-weight:800;letter-spacing:.13em;
  text-transform:uppercase;border-radius:99px;padding:4px 9px}
.dbar .x{background:rgb(255 255 255/.14);border-radius:99px;width:26px;height:26px;display:grid;place-items:center;font-size:14px}
.dbar .x:hover{background:rgb(255 255 255/.26)}
.dbar.hide{display:none}
@media (max-width:700px){.dbar .lbl{display:none}}

/* toast for actions that are intentionally inert in a demo */
.toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(10px);bottom:74px;z-index:50;
  background:#211B15;color:#fff;border-radius:11px;padding:10px 16px;font-size:12.5px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 8px 26px rgb(0 0 0/.3);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"></div>

<div class="dbar" id="dbar">
  <span class="tag">Demo</span>
  <span class="lbl"><b>__TITLE__</b> — sample data, click anything to explore</span>
  <button class="x" onclick="document.getElementById('dbar').classList.add('hide')" aria-label="Hide">×</button>
</div>
<div id="assist" data-mock-tokens></div>
<div class="toast" id="toast"></div>

<script>
const DATA = __DATA_JSON__;

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ==== mock engine (shared with the feature catalog) ==== */
__MOCK_JS__

/* ==== portal router ==== */
const MOD = Object.fromEntries(DATA.modules.map(m=>[m.id,m]));
let state = { module: DATA.modules[0].id, page: null };

/* flatten a module's nav into the engine's string form + a parallel page map */
function navFor(mod, activePage){
  const rows=[], pages=[];
  MOD[mod].nav.forEach(item=>{
    const kids = item.children||[];
    const selfActive = item.page && item.page===activePage;
    const openHere = kids.length && kids.some(k=>k.page===activePage);
    /* '>' keeps the chevron on a collapsed group; only the open group lists its children */
    rows.push(item.label + (selfActive?'*':'') + (kids.length && !openHere ? '>' : ''));
    pages.push(item.page || (kids.length ? kids[0].page : null));
    if(openHere){
      kids.forEach(k=>{ rows.push('- '+k.label+(k.page===activePage?'*':'')); pages.push(k.page||null) });
    }
  });
  return {rows, pages};
}
function firstPage(mod){
  for(const item of MOD[mod].nav){
    if(item.page) return item.page;
    if(item.children) for(const k of item.children) if(k.page) return k.page;
  }
}
function render(){
  const page = DATA.pages[state.page];
  const {rows, pages} = navFor(state.module, state.page);
  const scr = {
    id: state.page, device:'desktop', module: state.module,
    inst: DATA.institute, credits: DATA.credits,
    title: page.title, nav: rows, widgets: page.widgets
  };
  const app = document.getElementById('app');
  app.innerHTML = renderScreen(scr);
  app.querySelector('.mock-main').scrollTop = 0;

  app.querySelectorAll('.mock-rail .rm').forEach(el=>{
    const id = el.getAttribute('data-mod');
    if(!MOD[id]){ el.onclick = ()=> toast(el.textContent.trim()+' — not part of this demo'); return }
    el.onclick = ()=>{ state.module = id; state.page = firstPage(id); render() };
  });
  app.querySelectorAll('.mock-side .ni').forEach((el,i)=>{
    const p = pages[i];
    el.onclick = ()=> p ? go(p) : toast('Section — pick a page inside it');
  });
  app.querySelectorAll('.mtabs .tb').forEach(el=>{
    el.onclick = ()=>{
      el.parentElement.querySelectorAll('.tb').forEach(t=>t.classList.remove('on'));
      el.classList.add('on');
      toast(el.textContent.trim()+' — sample data');
    };
  });
  app.querySelectorAll('.mbtn,.mcard .cbtn,.mock-top .mt-switch,.mock-urail .ur,.mfilters .fchip')
     .forEach(el=>{ el.onclick = ()=> toast(el.textContent.trim()+' — demo, no changes are saved') });
  app.querySelectorAll('.mock-urail .ur').forEach(el=>{
    if(/assist/i.test(el.textContent)) el.onclick = toggleAssist;
  });

  const slug = state.module+'/'+state.page;
  if(location.hash.slice(1)!==slug) history.replaceState(null,'','#'+slug);
  document.title = page.title+' · '+DATA.meta.title;
}
function go(page){
  if(!DATA.pages[page]) return;
  state.page = page;
  render();
}
/* the assistant is chrome, not a page — it renders once and floats over whatever is open */
function toggleAssist(){
  const el = document.getElementById('assist');
  if(!el.innerHTML) el.innerHTML = renderWidget(DATA.assistant);
  el.classList.toggle('open');
}
addEventListener('click', e=>{
  const el = document.getElementById('assist');
  if(!el.classList.contains('open')) return;
  if(e.target.closest('#assist .ah .ax')) el.classList.remove('open');
});

let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1900);
}
function boot(){
  const [m,p] = location.hash.slice(1).split('/');
  if(m && MOD[m]){ state.module=m; state.page = (p && DATA.pages[p]) ? p : firstPage(m) }
  else { state.page = firstPage(state.module) }
  render();
}
addEventListener('hashchange',()=>{
  const [m,p]=location.hash.slice(1).split('/');
  if(m&&MOD[m]&&p&&DATA.pages[p]&&(m!==state.module||p!==state.page)){state.module=m;state.page=p;render()}
});
boot();
</script>
</body>
</html>
